name: CI API Medal Tests

on:
  push:
    branches: [ main, incremento_ii ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Configurar entorno y Levantar Servicios
        working-directory: ./docker
        run: |
          # 1. Crear archivo .env dinámico basado en tu .env-example
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=1" >> .env
          echo "DB_NAME=medal" >> .env
          echo "API_PORT_EXTERNAL=8080" >> .env
          echo "DB_PORT_EXTERNAL=10001" >> .env
          echo "DB_HOST=medal-bdd-postgres" >> .env
          echo "DB_PORT_INTERNAL=5432" >> .env
          echo "API_DIRECTION=http://localhost:8080" >> .env
          echo "PORT=8080" >> .env
          echo "JWT_SECRET=5e40edda6cd84b78d3944603a60d8a19fd736035765542a257f252dba23327ed" >> .env
          echo "REDIS_PASSWORD=vYVSiOC9Tadt4QlWQE6zDGdit97ksBWluVFdEMG5GIQQ0OtgPW" >> .env

          # 2. Levantar BDD y API (Usando 'docker compose' V2)
          # Solo levantamos estos dos para optimizar el tiempo de ejecución en GitHub
          docker compose up -d --build medal-bdd-postgres redis medal-api-core

      - name: Esperar a que la API esté lista (Healthcheck)
        run: |
          echo "Esperando a que el contenedor apiMedal responda en el puerto 8080..."
          timeout 60s bash -c 'until curl -s http://localhost:8080/api/user/login > /dev/null; do sleep 3; done'
          echo "API Medal lista para recibir peticiones."

      - name: Ejecutar Tests de Pytest
        working-directory: ./docker/test/api
        run: |
          # Ejecutamos el archivo de tests que hemos estado preparando
          pytest test_api.py -v -s

      - name: Debug en caso de fallo
        if: failure()
        run: |
          echo "--- ESTADO DE LOS CONTENEDORES ---"
          docker ps
          echo "--- LOGS DE LA API ---"
          docker logs apiMedal
          echo "--- LOGS DE LA BASE DE DATOS ---"
          docker logs dbMedal

      - name: Detener y limpiar servicios
        if: always()
        working-directory: ./docker
        run: |
          docker compose down
