name: CI API Medal Tests

on:
  push:
    branches: [ main, incremento_ii ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Crear estructura falsa para medal-afirma
        working-directory: ./docker
        run: |
          echo "Creando carpetas para medal-afirma..."

          # Crear carpetas
          mkdir -p firma/war-despliegue

          # Archivos requeridos por los mounts del compose
          touch firma/war-despliegue/tps_config.properties
          touch firma/tomcat-users.xml
          touch firma/context.xml

          # Prevenir errores típicos de Tomcat si espera contenido XML
          echo '<?xml version="1.0" encoding="UTF-8"?>' > firma/tomcat-users.xml
          echo '<?xml version="1.0" encoding="UTF-8"?>' > firma/context.xml
          echo '' > firma/war-despliegue/tps_config.properties

      - name: Configurar entorno y Levantar Servicios
        working-directory: ./docker
        run: |
          # Crear archivo .env con la nueva configuración
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=1" >> .env
          echo "DB_NAME=medal" >> .env
          echo "API_PORT_EXTERNAL=8080" >> .env
          echo "DB_PORT_EXTERNAL=10001" >> .env
          echo "DB_HOST=medal-bdd-postgres" >> .env
          echo "DB_PORT_INTERNAL=5432" >> .env
          echo "API_DIRECTION=http://localhost:8080" >> .env
          echo "PORT=8080" >> .env
          echo "JWT_SECRET=5e40edda6cd84b78d3944603a60d8a19fd736035765542a257f252dba23327ed" >> .env
          
          # Configuración de Redis
          echo "REDIS_PASSWORD=vYVSiOC9Tadt4QlWQE6zDGdit97ksBWluVFdEMG5GIQQ0OtgPW" >> .env
          echo "REDIS_IP=127.0.0.1" >> .env
          echo "PORT_REDIS=6379" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "REDIS_URL=redis://default:vYVSiOC9Tadt4QlWQE6zDGdit97ksBWluVFdEMG5GIQQ0OtgPW@redis:6379" >> .env
          
          # Configuración de Gmail
          echo "GMAIL_USER=pgpprueba609@gmail.com" >> .env
          echo "GMAIL_APP_PASSWORD=mvdpbpgavdcghhpw" >> .env

          # Levantar servicios necesarios
          docker compose up -d --build medal-bdd-postgres redis medal-api-core medal-afirma

      - name: Esperar a que la API esté lista (Healthcheck)
        run: |
          echo "Esperando a que el contenedor apiMedal responda..."
          timeout 30s bash -c 'until curl -s http://localhost:8080/api/user/login > /dev/null; do sleep 2; done'
          echo "API Medal lista."

      - name: Ejecutar Tests de Pytest
        working-directory: ./docker/test/api
        run: |
          pytest test_api.py -v -s

      - name: Debug en caso de fallo
        if: failure()
        run: |
          echo "--- ESTADO DE LOS CONTENEDORES ---"
          docker ps
          echo "--- LOGS DE LA API ---"
          docker logs apiMedal
          echo "--- LOGS DE REDIS ---"
          docker logs redis_queue
          echo "--- LOGS DE AFIRMA ---"
          docker logs medal-afirma

      - name: Detener y limpiar servicios
        if: always()
        working-directory: ./docker
        run: |
          docker compose down
