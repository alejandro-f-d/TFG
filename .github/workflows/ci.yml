name: CI - Docker API + Pytest

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose version

      - name: Create .env file
        run: |
          echo "DB_USER=postgres" >> docker/.env
          echo "DB_PASSWORD=postgres" >> docker/.env
          echo "DB_NAME=medaltest" >> docker/.env
          echo "DB_PORT_EXTERNAL=5432" >> docker/.env
          echo "API_PORT_EXTERNAL=8080" >> docker/.env
          echo "PORT=8080" >> docker/.env
          echo "JWT_SECRET=testsecret" >> docker/.env

      - name: Start containers (DB + API)
        working-directory: docker
        run: |
          docker compose up -d medal-bdd-postgres medal-api-core

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API to become ready..."
          for i in {1..20}; do
            if curl -s -f http://localhost:8080/api/healthcheck; then
              echo "API is ready!"
              break
            fi
            echo "API not ready yet, waiting 3s..."
            sleep 3
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run tests
        run: |
          pytest docker/test/api -v

      - name: Stop containers
        if: always()
        working-directory: docker
        run: docker compose down
