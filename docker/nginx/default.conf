ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;

server {
    listen 80;
    server_name medal-web-server;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name medal-web-server;

    # DNS interno de Docker (Evita el error "host not found in upstream")
    resolver 127.0.0.11 valid=30s;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # --- TU API ACTUAL ---
    location / {
        # Usamos variable para que Nginx arranque aunque el otro contenedor no esté listo
        set $api_core medal-api-core;
        proxy_pass http://$api_core:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- NUEVA RUTA PARA @FIRMA (Tomcat) ---
    location ~ ^/(manager|host-manager|afirma-server|afirma-signature|triphase|retriever|storage) {
        set $tomcat_server medal-afirma;
        proxy_pass http://$tomcat_server:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        client_max_body_size 50M;
        # Aumentamos el tiempo de espera para procesos de firma largos
        proxy_read_timeout 300;
    }
}
