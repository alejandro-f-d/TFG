server {
    listen 443 ssl;
    server_name medal-web-server; # O la IP de tu servidor/máquina

    resolver 127.0.0.11 valid=30s;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # --- 1. FRONTEND (Next.js) ---
    location / {
        set $frontend "webMedal"; 
        proxy_pass http://$frontend:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSockets (Arregla el error de HMR de Next.js)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- 2. API (Node.js) ---
    location ~ ^/(api|admin/queues) {
        set $api_core "medal-api-core";

        # Configuración CORS (Ya te funciona, la mantenemos)
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'X-Requested-With,Accept,Content-Type,Origin,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'X-Requested-With,Accept,Content-Type,Origin,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }

        proxy_pass http://$api_core:8080$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 3. @FIRMA (Tomcat) ---
    location ~ ^/(manager|host-manager|afirma-server|afirma-signature|triphase|retriever|storage) {
        set $tomcat_server "medal-afirma";
        proxy_pass http://$tomcat_server:8080;
        # ... mismos headers de IP que arriba ...
    }
}
