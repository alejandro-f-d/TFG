name: medal-gestion-sistema

services:

# Bases de datos.
  medal-bdd-postgres:
    container_name: dbMedal
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_EXTERNAL}:5432"
    volumes:
      - pgdata_volume:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medalnetwork


# REDIS para la cola de mensajes
  redis:
    image: redis:8.6.1-alpine
    container_name: redis_queue
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_IP}:${PORT_REDIS}:6379" # Si quieres que sea accesible desde otra ip quitar el 127.0.0.1. Habría que mirar certificados para tener seguridad en este acceso.
    volumes:
      - redis_data:/data
    networks:
      - medalnetwork
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5



# Sistema de la api general.
  medal-api-core:
    container_name: apiMedal
    build: ./api-core
    restart: always
    depends_on:
      medal-bdd-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_IP}:${API_PORT_EXTERNAL}:8080"
    environment:
      DB_URL: postgres://${DB_USER}:${DB_PASSWORD}@medal-bdd-postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
      WEB_URL: ${WEB_URL}
      STORAGE_URL: ${STORAGE_URL}
      DSS_URL: ${DSS_URL}
      SERIAL: ${SERIAL}
      COMMON_NAME: ${COMMON_NAME}
    networks:
      - medalnetwork
    env_file:
      - .env

# Servicio para las operaciones pesadas del monitoreo.
  medal-worker:
    container_name: workerMedal
    build: ./worker
    environment:
      DB_URL: postgres://${DB_USER}:${DB_PASSWORD}@medal-bdd-postgres:5432/${DB_NAME}
      API_URL: http://medal-api-core:8080
      REDIS_URL: ${REDIS_URL}
      GMAIL_USER: ${GMAIL_USER}
      GOOGLE_APP_PASSWORD: ${GOOGLE_APP_PASSWORD}
      WEB_URL: ${WEB_URL}
      STORAGE_URL: ${STORAGE_URL}
    networks:
      - medalnetwork


# Servicio para el almacenado de los documentos firmados.
# No tiene puertos abiertos al exterior porque la API es la única que puede interactuar con este microservicio.

  medal-storage:
    container_name: storageMedal
    build: ./storage-service
    volumes:
      - ./storage/firmas:/app/data/pdfs
    networks:
      - medalnetwork


# Servicio de validación de firmas digitales en el sistema:
  medal-sign-validator:
    container_name: signValidatorMedal
    image: dss-demo:latest
    ports:
      - "${DSS_IP}:${DSS_PORT}:8080" # Si quieres que sea accesible desde otra ip quitar el 127.0.0.1. Habría que mirar certificados para tener seguridad en este acceso.
    restart: always
    networks:
      - medalnetwork


# Nginx: Encargado de la capa de seguridad para https:
  medal-nginx:
    container_name: nginxmedal
    image: nginx:1.25-bookworm 
    ports:
      - "80:80"   
      - "443:443" 
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - medalnetwork
    depends_on:
      - medal-api-core

# Apache: 
  medal-afirma:
    image: tomcat:9.0-jdk11-openjdk
    container_name: afirma_server
    ports:
      - "${IP_TOMCAT}:${PORT_TOMCAT}:8080"
    environment:
      - CATALINA_OPTS=-Xms512M -Xmx2048M -Dclienteafirma.config.path=/usr/local/tomcat/conf/
    
    command: bash -c "cp -rv /usr/local/tomcat/webapps.dist/* /usr/local/tomcat/webapps/ && catalina.sh run"
    
    volumes:
      - ./firma/war-despliegue/:/usr/local/tomcat/webapps
      - ./firma/war-despliegue/tps_config.properties:/usr/local/tomcat/conf/tps_config.properties
      - afirma_data:/opt/afirma
      - afirma_temp:/tmp/afirma 
      - ./firma/tomcat-users.xml:/usr/local/tomcat/conf/tomcat-users.xml
      - ./firma/context.xml:/usr/local/tomcat/webapps.dist/manager/META-INF/context.xml
      - ./firma/context.xml:/usr/local/tomcat/webapps.dist/host-manager/META-INF/context.xml
    networks:
      - medalnetwork
# Frontend:
  medal-frontend:
    container_name: webMedal
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - medal-api-core
    networks:
      - medalnetwork
volumes:
  pgdata_volume:
  redis_data:
  afirma_data:
  afirma_temp:


networks:
  medalnetwork:
    driver: bridge
